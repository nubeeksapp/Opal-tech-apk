name: Publish Pre-Compiled APK Release

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'apk-distribution/app-debug.apk'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate APK and Checksum
        run: |
          test -f apk-distribution/app-debug.apk || { echo "APK file not found!"; exit 1; }
          test -s apk-distribution/app-debug.apk || { echo "APK file is empty!"; exit 1; }
          test -f apk-distribution/app-debug.apk.sha256 || { echo "Checksum file not found!"; exit 1; }
          cd apk-distribution
          sha256sum -c app-debug.apk.sha256 || { echo "SHA-256 verification failed!"; exit 1; }
          unzip -tq app-debug.apk || { echo "APK ZIP integrity test failed!"; exit 1; }

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          
          gh release create "${TAG_NAME}" apk-distribution/app-debug.apk \
            --title "${RELEASE_TITLE}" \
            --notes "Installable Debug APK compiled natively inside Google AI Studio. Validated ZIP structure and SHA-256." \
            --latest

          APK_SIZE=$(ls -lh apk-distribution/app-debug.apk | awk '{print $5}')
          APK_SHA=$(cat apk-distribution/app-debug.apk.sha256 | awk '{print $1}')
          REPO_URL="${{ github.server_url }}/${{ github.repository }}"

          echo "### APK Build & Publication Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Release Tag**: \`${TAG_NAME}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **APK File**: \`app-debug.apk\`" >> $GITHUB_STEP_SUMMARY
          echo "- **APK Size**: \`${APK_SIZE}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA-256**: \`${APK_SHA}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Release Page**: ${REPO_URL}/releases/tag/${TAG_NAME}" >> $GITHUB_STEP_SUMMARY
          echo "- **Direct Download URL**: ${REPO_URL}/releases/latest/download/app-debug.apk" >> $GITHUB_STEP_SUMMARY
