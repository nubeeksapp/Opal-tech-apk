name: Build and Publish Latest APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Restore Persistent Signing Keystore
        env:
          KEYSTORE_SECRET: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_SECRET" ]; then
            echo "$KEYSTORE_SECRET" | tr -d ' \n\r' | base64 -d > debug.keystore
          elif [ -f debug.keystore.base64 ]; then
            cat debug.keystore.base64 | tr -d ' \n\r' | base64 -d > debug.keystore
          else
            cat << 'EOF' | tr -d ' \n\r' | base64 -d > debug.keystore
          
          EOF
          fi

          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi
          chmod +x gradlew

      - name: Compile Latest Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon

      - name: Validate Compiled APK and Signature
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK_PATH" || { echo "APK was not generated!"; exit 1; }
          test -s "$APK_PATH" || { echo "APK file is empty!"; exit 1; }
          unzip -tq "$APK_PATH" || { echo "APK ZIP integrity check failed!"; exit 1; }
          mkdir -p apk-distribution
          cp "$APK_PATH" apk-distribution/app-debug.apk
          cd apk-distribution
          sha256sum app-debug.apk > app-debug.apk.sha256
          sha256sum -c app-debug.apk.sha256

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v1.0.${{ github.run_number }}"
          RELEASE_TITLE="Opal Tech v1.0.${{ github.run_number }}"
          APK_FILE="apk-distribution/app-debug.apk"

          # Publish release as official latest release
          gh release create "${TAG_NAME}" "${APK_FILE}" \
            --title "${RELEASE_TITLE}" \
            --notes "Latest installable Debug APK for Opal Tech built automatically from commit ${{ github.sha }}. Signed with persistent Opal Tech certificate." \
            --latest

          APK_SIZE=$(ls -lh "${APK_FILE}" | awk '{print $5}')
          APK_SHA=$(awk '{print $1}' apk-distribution/app-debug.apk.sha256)
          REPO_URL="${{ github.server_url }}/${{ github.repository }}"

          echo "### Latest APK Build & Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Release Tag**: \`${TAG_NAME}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **APK Filename**: \`app-debug.apk\`" >> $GITHUB_STEP_SUMMARY
          echo "- **File Size**: \`${APK_SIZE}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA-256**: \`${APK_SHA}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Release Page**: ${REPO_URL}/releases/tag/${TAG_NAME}" >> $GITHUB_STEP_SUMMARY
          echo "- **Direct Download URL**: ${REPO_URL}/releases/latest/download/app-debug.apk" >> $GITHUB_STEP_SUMMARY
